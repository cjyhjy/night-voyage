<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>二十 · 夜航长卷</title>
<meta name="description" content="从十九岁的夜晚，驶向二十岁的清晨。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1d33'/%3E%3Ccircle cx='21' cy='10' r='4.5' fill='%23F2E9D3'/%3E%3Cpath d='M6 21q10 5 20 0' fill='none' stroke='%23C9A96A' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="assets/img/scene-night.webp" as="image">
<link rel="preload" href="assets/fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/brush.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/main.css">
</head>
<body class="is-waiting">

<!-- ========== 背景世界（固定层）：山水、月亮、雾、晨光 ========== -->
<div id="world" aria-hidden="true">
  <div class="scene">
    <div class="scene-img night"></div>
    <div class="scene-img blue"></div>
    <div class="scene-img dawn"></div>
    <div class="moon-halo"></div>
    <div class="moon"></div>
    <div class="sun"></div>
  </div>
  <div class="dawn-haze"></div>
  <div class="fog fog-far"></div>
  <div class="fog fog-near"></div>
  <div class="world-shade"></div>
</div>

<!-- 开卷时的“未渲染”墨色层，小舟划过的地方会被晕开 -->
<canvas id="reveal" aria-hidden="true"></canvas>
<!-- 金色水纹 / 墨晕 / 粒子 -->
<canvas id="fx" aria-hidden="true"></canvas>
<!-- 开卷的小舟 -->
<div id="voyager" aria-hidden="true"></div>

<!-- ========== 入卷 ========== -->
<div id="entrance">
  <div class="entrance-inner">
    <h1 class="entrance-lines"></h1>
    <button id="enter" type="button"><span class="enter-text"></span><i class="enter-line"></i></button>
  </div>
  <p class="entrance-note"></p>
</div>

<header class="masthead">
  <span class="mark">二十</span><span class="mark-sub">夜航长卷</span>
</header>
<button id="sound" type="button" aria-pressed="false" aria-label="声音">
  <span class="note-glyph">♪</span><i class="mute-slash"></i>
</button>
<div class="progress" aria-hidden="true"><i></i></div>
<div class="act-tag" aria-hidden="true"></div>

<main id="main">
  <!-- 启舟 -->
  <section id="voyage" class="chapter hero" data-act="启舟">
    <div class="hero-title">
      <svg class="twenty-svg" viewBox="20 20 2020 880" role="img" aria-label="二十"></svg>
    </div>
    <p class="hero-sub"></p>
    <p class="hero-small"></p>
    <a class="scroll-cue" href="#her"><span></span><i></i></a>
  </section>

  <!-- 她 -->
  <section id="her" class="chapter scrolly" data-act="她">
    <div class="stage">
      <div class="her-intro"></div>
      <div class="her-words"></div>
      <div class="her-gather"></div>
      <div class="her-final"></div>
    </div>
  </section>

  <!-- 二十 -->
  <section id="twenty" class="chapter scrolly" data-act="二十">
    <div class="stage">
      <svg class="window20" aria-hidden="true"></svg>
      <div class="twenty-lines"></div>
    </div>
  </section>

  <!-- 二十笺 -->
  <section id="notes" class="chapter" data-act="二十笺">
    <header class="notes-head">
      <h2 class="brush-title"></h2>
      <p class="notes-sub"></p>
      <p class="notes-count"></p>
    </header>
    <div class="notes-field"></div>
  </section>

  <!-- 愿 -->
  <section id="wishes" class="chapter" data-act="愿">
    <h2 class="brush-title wish-title"></h2>
    <div class="wish-lines"></div>
    <div class="wish-final"><p></p></div>
    <div class="lanterns">
      <div class="lantern-head"><p class="lantern-intro"></p><p class="lantern-sub"></p></div>
      <div class="lantern-row"></div>
      <p class="lantern-status" aria-live="polite"></p>
      <div class="lantern-done"></div>
    </div>
  </section>

  <!-- 相逢 -->
  <section id="meeting" class="chapter scrolly" data-act="相逢">
    <div class="stage">
      <svg class="routes" aria-hidden="true"></svg>
      <div class="meeting-lines"></div>
      <p class="meeting-days"></p>
    </div>
  </section>

  <!-- 给你 -->
  <section id="letter" class="chapter" data-act="给你">
    <button class="envelope" type="button">
      <span class="env-paper">
        <span class="env-title"></span>
        <span class="env-sub"></span>
        <span class="env-seal"><i></i></span>
      </span>
      <span class="env-hint"></span>
    </button>
  </section>

  <!-- 天明 -->
  <section id="dawn" class="chapter scrolly" data-act="天明">
    <div class="stage">
      <div class="dawn-lines"></div>
      <h2 class="dawn-title"></h2>
      <p class="dawn-en"></p>
      <p class="dawn-tbc"></p>
      <button class="replay" type="button"><span></span><i></i></button>
    </div>
  </section>

  <div class="after-space" aria-hidden="true"></div>
  <section id="secret" aria-label="">
    <div class="stage">
      <svg class="ink-drop" viewBox="-60 -60 120 120" aria-hidden="true"></svg>
      <div class="secret-lines"></div>
      <p class="secret-final"></p>
      <svg class="gold-flower" viewBox="-50 -50 100 100" aria-hidden="true"></svg>
    </div>
  </section>
</main>

<!-- 拆开的纸笺 -->
<div id="jian-modal" hidden>
  <div class="jian-backdrop"></div>
  <article class="jian-open" role="dialog" aria-modal="true" aria-labelledby="jian-open-title">
    <p class="jian-open-no"></p>
    <h3 id="jian-open-title" class="jian-open-key"></h3>
    <p class="jian-open-text"></p>
    <p class="jian-open-sign"></p>
    <div class="jian-open-nav">
      <button type="button" class="jian-prev">上一笺</button>
      <button type="button" class="jian-close">收起</button>
      <button type="button" class="jian-next">下一笺</button>
    </div>
  </article>
</div>

<!-- 信 -->
<div id="letter-sheet" hidden>
  <div class="sheet-scroll">
    <article class="sheet">
      <p class="sheet-greeting"></p>
      <div class="sheet-body"></div>
      <div class="sheet-closing"></div>
      <p class="sheet-sign"></p>
      <button type="button" class="sheet-close"><span></span><i></i></button>
    </article>
  </div>
</div>

<script src="content.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/MotionPathPlugin.min.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/util.js"></script>
<script src="js/sound.js"></script>
<script src="js/world.js"></script>
<script src="js/fx.js"></script>
<script src="js/boat.js"></script>
<script src="js/opening.js"></script>
<script src="js/her.js"></script>
<script src="js/twenty.js"></script>
<script src="js/notes.js"></script>
<script src="js/wishes.js"></script>
<script src="js/meeting.js"></script>
<script src="js/letter.js"></script>
<script src="js/dawn.js"></script>
<script src="js/main.js"></script>
</body>
</html>
